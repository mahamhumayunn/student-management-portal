{% extends "layout.html" %}

{% block page_content %}
<h2>➕ Add New Student</h2>

<div class="card">
    {% if message %}
        {% if success %}
        <div class="alert alert-success">✅ {{ message }}</div>
        {% else %}
        <div class="alert alert-error">❌ {{ message }}</div>
        {% endif %}
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Student ID</label>
            <input type="text" name="student_id" placeholder="e.g. S006" required>
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="e.g. Sara Khan" required>
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" min="10" max="80" placeholder="e.g. 20" required>
        </div>
        <div class="form-group">
            <label>Course</label>
            <input type="text" name="course" placeholder="e.g. Computer Science" required>
        </div>
        <div class="form-group">
            <label>Marks (0 - 100)</label>
            <input type="number" name="marks" min="0" max="100" step="0.1" placeholder="e.g. 85" required>
        </div>
        <button type="submit" class="btn btn-green">Add Student</button>
        <a href="/view" class="btn btn-grey" style="margin-left:10px;">View All</a>
    </form>
</div>
{% endblock %}
