{% extends "layout.html" %}

{% block page_content %}
<h2>✏️ Update Student Record</h2>

{% if message %}
    {% if success %}
    <div class="alert alert-success">✅ {{ message }}</div>
    {% else %}
    <div class="alert alert-error">❌ {{ message }}</div>
    {% endif %}
{% endif %}

{% if not found %}
<div class="card">
    <form method="POST">
        <input type="hidden" name="action" value="find">
        <div class="form-group">
            <label>Enter Student ID to Update</label>
            <input type="text" name="student_id" placeholder="e.g. S001" required>
        </div>
        <button type="submit" class="btn btn-blue">Find Student</button>
    </form>
</div>

{% else %}
<div class="card">
    <p style="margin-bottom:15px; color:#555;">Editing: <strong>{{ found.name }}</strong> ({{ found.student_id }})</p>
    <form method="POST">
        <input type="hidden" name="action" value="save">
        <input type="hidden" name="student_id" value="{{ found.student_id }}">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" value="{{ found.name }}" required>
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" value="{{ found.age }}" min="10" max="80" required>
        </div>
        <div class="form-group">
            <label>Course</label>
            <input type="text" name="course" value="{{ found.course }}" required>
        </div>
        <div class="form-group">
            <label>Marks (0 - 100)</label>
            <input type="number" name="marks" value="{{ found.marks }}" min="0" max="100" step="0.1" required>
        </div>
        <button type="submit" class="btn btn-green">Save Changes</button>
        <a href="/update" class="btn btn-grey" style="margin-left:10px;">Cancel</a>
    </form>
</div>
{% endif %}
{% endblock %}
