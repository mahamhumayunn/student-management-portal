<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
        }

        .navbar {
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h1 { font-size: 20px; }
        .navbar .user-info { font-size: 14px; color: #ccc; }
        .navbar a { color: #e74c3c; text-decoration: none; font-size: 14px; }
        .navbar a:hover { text-decoration: underline; }

        .layout {
            display: flex;
            min-height: calc(100vh - 55px);
        }

        .sidebar {
            width: 200px;
            background: #34495e;
            padding: 20px 0;
        }
        .sidebar a {
            display: block;
            color: #ecf0f1;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 15px;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #2c3e50;
            color: #3498db;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        h2 { margin-bottom: 20px; color: #2c3e50; }

        .card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            max-width: 700px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-group input:focus { border-color: #3498db; outline: none; }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-blue  { background: #3498db; color: white; }
        .btn-green { background: #27ae60; color: white; }
        .btn-red   { background: #e74c3c; color: white; }
        .btn-grey  { background: #95a5a6; color: white; }
        .btn:hover { opacity: 0.85; }

        .alert {
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .alert-error   { background: #fde8e8; color: #c0392b; border: 1px solid #e74c3c; }
        .alert-success { background: #e8f8f0; color: #1a7a3c; border: 1px solid #27ae60; }
        .alert-info    { background: #e8f4fd; color: #1a5276; border: 1px solid #3498db; }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        th { background: #2c3e50; color: white; padding: 12px 15px; text-align: left; }
        td { padding: 11px 15px; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f5f9ff; }

        .grade-A { background: #27ae60; color: white; padding: 2px 8px; border-radius: 4px; }
        .grade-B { background: #2980b9; color: white; padding: 2px 8px; border-radius: 4px; }
        .grade-C { background: #f39c12; color: white; padding: 2px 8px; border-radius: 4px; }
        .grade-D { background: #e67e22; color: white; padding: 2px 8px; border-radius: 4px; }
        .grade-F { background: #e74c3c; color: white; padding: 2px 8px; border-radius: 4px; }

        .stats-row { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-box {
            background: white;
            border-radius: 8px;
            padding: 20px 25px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            min-width: 130px;
        }
        .stat-box .number { font-size: 32px; font-weight: bold; color: #3498db; }
        .stat-box .label  { font-size: 13px; color: #777; margin-top: 5px; }
    </style>
</head>
<body>

{% block content %}{% endblock %}

</body>
</html>
