{% extends "base.html" %}

{% block content %}
<div style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f0f4f8;">
    <div class="card" style="width:380px;">
        <div style="text-align:center; margin-bottom:25px;">
            <div style="font-size:50px;">🎓</div>
            <h2 style="margin-top:10px;">Student Portal Login</h2>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-blue" style="width:100%; padding:12px; font-size:16px;">
                Login
            </button>
        </form>

        <div style="margin-top:20px; text-align:center; color:#777; font-size:13px;">
            Default: <strong>admin</strong> / <strong>admin123</strong>
        </div>
    </div>
</div>
{% endblock %}
